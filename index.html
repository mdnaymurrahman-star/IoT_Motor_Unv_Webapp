<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My-Motor Dashboard</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  min-height: 100vh;
  transition: background-color 0.3s;
}

/* Overlay when custom bg is set */
body.has-bg::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.78);
  z-index: -1;
}

#dashboard { padding-bottom: 40px; position: relative; z-index: 1; }

/* ============== HEADER ============== */
.header {
  background: rgba(26,26,26,0.92);
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #00b300;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(6px);
}
.header h2 {
  margin: 0;
  font-size: 17px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.settings-icon {
  background: #333;
  color: white;
  border: none;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  font-size: 19px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: background 0.2s;
}
.settings-icon:active { background: #00b300; }

.header-right { width: 38px; }

/* ============== DEVICE TABS ============== */
.tabs {
  display: flex;
  overflow-x: auto;
  background: rgba(26,26,26,0.92);
  padding: 8px;
  gap: 6px;
  backdrop-filter: blur(6px);
}
.tabs:empty { display: none; }
.tab {
  padding: 8px 14px 8px 10px;
  background: #333;
  border-radius: 20px;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  border: 2px solid transparent;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab.active { background: #00b300; border-color: #00ff00; }
.tab .dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: red;
  flex-shrink: 0;
}
.tab .dot.online { background: lime; }
.tab .motor-icon { width: 16px; height: 16px; flex-shrink: 0; }

/* ============== DEVICE PANEL ============== */
.panel { padding: 15px; }
.panel h3 {
  margin: 5px 0 15px;
  color: #00d400;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 17px;
}
.esp-line { margin-bottom: 15px; font-size: 15px; }

.status {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: inline-block;
  background: red;
  vertical-align: middle;
}

.btn {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: none;
  font-size: 17px;
  font-weight: bold;
  color: white;
  margin: 10px;
  cursor: pointer;
}
.green { background: #00b300; }
.redbtn { background: #cc0000; }
.green:active { background: #006600; }
.redbtn:active { background: #800000; }

.indicator {
  width: 100%;
  max-width: 400px;
  margin: 12px auto;
  padding: 18px;
  font-size: 18px;
  border-radius: 14px;
  background: #333;
}
.high { background: #b30000; }
.low  { background: #006600; }
.wait { background: #444; }

/* ============== EMPTY STATE ============== */
.empty-state {
  padding: 60px 20px;
  color: #888;
}
.empty-state .motor-big { width: 80px; height: 80px; opacity: 0.4; margin-bottom: 20px; }
.empty-state p { font-size: 16px; margin: 10px 0; }
.empty-state .add-btn {
  margin-top: 20px;
  padding: 12px 28px;
  background: #00b300;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

/* ============== SETTINGS MODAL ============== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal.show { display: flex; }
.modal-box {
  background: #1e1e1e;
  padding: 22px;
  border-radius: 16px;
  width: 100%;
  max-width: 400px;
  max-height: 90vh;
  overflow-y: auto;
  text-align: left;
}
.modal-box h3 {
  margin: 0 0 18px;
  color: #00d400;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 18px;
}
.modal-box h3 .close-x {
  background: #333;
  color: white;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
.section {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid #333;
}
.section-title {
  color: #00d400;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 10px;
  display: block;
}
.modal-box label { display: block; font-size: 13px; margin: 10px 0 4px; color: #aaa; }
.modal-box input[type="text"],
.modal-box input[type="file"] {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #2a2a2a;
  color: white;
  font-size: 14px;
}
.modal-box input[type="file"] { padding: 8px; font-size: 13px; }
.row { display: flex; gap: 10px; margin-top: 14px; }
.row button {
  flex: 1;
  padding: 11px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  color: white;
}
.save-btn { background: #00b300; }
.cancel-btn { background: #555; }
.danger-btn {
  background: #cc0000;
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  font-size: 14px;
}

.theme-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 6px;
}
.theme-swatch {
  aspect-ratio: 1;
  border-radius: 10px;
  border: 2px solid transparent;
  cursor: pointer;
  position: relative;
}
.theme-swatch.active { border-color: #00ff00; box-shadow: 0 0 12px rgba(0,255,0,0.4); }
.theme-swatch span {
  position: absolute;
  bottom: 4px;
  left: 0; right: 0;
  font-size: 9px;
  text-align: center;
  color: white;
  text-shadow: 0 1px 3px black;
}

.device-list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #2a2a2a;
  padding: 10px 14px;
  border-radius: 8px;
  margin: 8px 0;
  font-size: 14px;
}
.device-list-item button {
  background: #cc0000;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
}
.empty-list { color: #666; font-size: 13px; padding: 10px 0; text-align: center; }
</style>
</head>

<body>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard">
  <div class="header">
    <button class="settings-icon" onclick="openSettings()" title="Settings">⚙️</button>
    <h2>
      <!-- Motor/Pump Icon -->
      <svg class="motor-icon" style="width:26px;height:26px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="8" stroke="#00d400" stroke-width="2"/>
        <circle cx="12" cy="12" r="3" fill="#00d400"/>
        <path d="M12 4 L12 1 M12 23 L12 20 M4 12 L1 12 M23 12 L20 12" stroke="#00d400" stroke-width="2" stroke-linecap="round"/>
        <path d="M6.5 6.5 L4.4 4.4 M19.6 19.6 L17.5 17.5 M6.5 17.5 L4.4 19.6 M19.6 4.4 L17.5 6.5" stroke="#00d400" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      My-Motor
    </h2>
    <div class="header-right"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>

<!-- ================= SETTINGS MODAL ================= -->
<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h3>
      ⚙️ Settings
      <button class="close-x" onclick="closeSettings()">✕</button>
    </h3>

    <!-- DEVICE MANAGEMENT -->
    <span class="section-title">📟 Device Management</span>
    <label>Add Device by Unique ID</label>
    <input type="text" id="newDeviceId" placeholder="e.g. naim02" autocomplete="off">
    <div class="row">
      <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
      <button class="save-btn" onclick="addDevice()">Add Device</button>
    </div>

    <label style="margin-top:16px;">Saved Devices</label>
    <div id="deviceList"></div>

    <!-- THEME -->
    <div class="section">
      <span class="section-title">🎨 Theme</span>
      <label>Choose Color Theme</label>
      <div class="theme-grid" id="themeGrid"></div>
    </div>

    <!-- BACKGROUND -->
    <div class="section">
      <span class="section-title">🖼️ Background Logo</span>
      <label>Upload Custom Background Image</label>
      <input type="file" id="bgUpload" accept="image/*" onchange="uploadBg(event)">
      <button class="danger-btn" onclick="removeBg()">🗑️ Remove Background</button>
    </div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const STORAGE_KEY = "mymotor_devices";
const THEME_KEY   = "mymotor_theme";
const BG_KEY      = "mymotor_bg";

/* ================= STATE ================= */
let devices = [];
let deviceStates = {};
let activeDevice = null;
let client = null;

/* ================= THEMES ================= */
const THEMES = {
  green:  { name: "Green",  primary: "#00b300", light: "#00d400", dark: "#006600", bg: "#111111" },
  blue:   { name: "Blue",   primary: "#0077cc", light: "#00aaff", dark: "#004d80", bg: "#0a1420" },
  red:    { name: "Red",    primary: "#cc0000", light: "#ff3333", dark: "#800000", bg: "#160808" },
  purple: { name: "Purple", primary: "#7a1fbf", light: "#a64dff", dark: "#4d1280", bg: "#120818" },
  orange: { name: "Orange", primary: "#e67300", light: "#ff9933", dark: "#994d00", bg: "#180e04" },
  cyan:   { name: "Cyan",   primary: "#009999", light: "#00cccc", dark: "#006666", bg: "#041414" },
  pink:   { name: "Pink",   primary: "#cc3399", light: "#ff66cc", dark: "#801f66", bg: "#160810" },
  dark:   { name: "Dark",   primary: "#666666", light: "#999999", dark: "#333333", bg: "#0a0a0a" }
};

/* ================= MOTOR SVG ================= */
const MOTOR_SVG = (color, size = 16) => `
  <svg class="motor-icon" style="width:${size}px;height:${size}px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="8" stroke="${color}" stroke-width="2"/>
    <circle cx="12" cy="12" r="3" fill="${color}"/>
    <path d="M12 4 L12 1 M12 23 L12 20 M4 12 L1 12 M23 12 L20 12" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
    <path d="M6.5 6.5 L4.4 4.4 M19.6 19.6 L17.5 17.5 M6.5 17.5 L4.4 19.6 M19.6 4.4 L17.5 6.5" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
`;

/* ================= THEME ================= */
function applyTheme(key) {
  const t = THEMES[key] || THEMES.green;
  document.documentElement.style.setProperty("--primary", t.primary);
  document.documentElement.style.setProperty("--light", t.light);
  document.documentElement.style.setProperty("--dark", t.dark);
  document.body.style.background = t.bg;
  localStorage.setItem(THEME_KEY, key);

  document.querySelectorAll(".green").forEach(el => el.style.background = t.primary);
  document.querySelectorAll(".save-btn, .empty-state .add-btn").forEach(el => el.style.background = t.primary);
  document.querySelectorAll(".tab.active").forEach(el => el.style.background = t.primary);
  document.querySelectorAll(".header").forEach(el => el.style.borderBottomColor = t.primary);
  document.querySelectorAll(".panel h3, .modal-box h3, .section-title").forEach(el => el.style.color = t.light);

  renderTabs();
  renderPanels();
  renderThemeGrid();
}

/* ================= BACKGROUND ================= */
function applyBg(dataUrl) {
  if (dataUrl) {
    document.body.style.backgroundImage = `url(${dataUrl})`;
    document.body.classList.add("has-bg");
  } else {
    document.body.style.backgroundImage = "none";
    document.body.classList.remove("has-bg");
  }
}
function uploadBg(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) return alert("ছবি ৩MB এর কম হতে হবে");
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    try {
      localStorage.setItem(BG_KEY, dataUrl);
      applyBg(dataUrl);
    } catch (err) {
      alert("ছবি সাইজ বেশি বড় — localStorage এ save হলো না");
    }
  };
  reader.readAsDataURL(file);
}
function removeBg() {
  localStorage.removeItem(BG_KEY);
  applyBg(null);
  document.getElementById("bgUpload").value = "";
}

/* ================= DEVICE MANAGEMENT ================= */
function loadDevices() {
  const raw = localStorage.getItem(STORAGE_KEY);
  devices = raw ? JSON.parse(raw) : [];
}
function saveDevices() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(devices));
}
function addDevice() {
  const id = document.getElementById("newDeviceId").value.trim().toLowerCase();
  if (!id) return alert("Unique ID লিখুন");
  if (!/^[a-z0-9_\-]+$/.test(id)) return alert("শুধু a-z, 0-9, _ , - ব্যবহার করুন");
  if (devices.includes(id)) return alert("এই Device আগে থেকেই আছে");

  devices.push(id);
  deviceStates[id] = { online: false, in1: null, in2: null, in3: null };
  saveDevices();
  subscribeDevice(id);
  document.getElementById("newDeviceId").value = "";
  if (!activeDevice) activeDevice = id;

  renderTabs();
  renderPanels();
  renderDeviceList();
}
function removeDevice(id) {
  if (!confirm(`"${id}" ডিভাইসটি মুছে ফেলবেন?`)) return;
  devices = devices.filter(d => d !== id);
  delete deviceStates[id];
  saveDevices();
  if (activeDevice === id) activeDevice = devices[0] || null;
  renderTabs();
  renderPanels();
  renderDeviceList();
}
function renderDeviceList() {
  const list = document.getElementById("deviceList");
  if (devices.length === 0) {
    list.innerHTML = `<div class="empty-list">এখনো কোনো ডিভাইস যোগ করা হয়নি</div>`;
    return;
  }
  list.innerHTML = devices.map(id => `
    <div class="device-list-item">
      <span>${id}</span>
      <button onclick="removeDevice('${id}')">Delete</button>
    </div>
  `).join("");
}

/* ================= MQTT ================= */
function initDashboard() {
  loadDevices();
  devices.forEach(id => {
    if (!deviceStates[id]) deviceStates[id] = { online: false, in1: null, in2: null, in3: null };
  });
  activeDevice = devices[0] || null;
  renderTabs();
  renderPanels();
  renderDeviceList();
  connectMQTT();
}

function connectMQTT() {
  client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
  client.on("connect", () => devices.forEach(id => subscribeDevice(id)));
  client.on("close", () => {
    devices.forEach(id => {
      if (!deviceStates[id]) return;
      deviceStates[id].online = false;
      deviceStates[id].in1 = null;
      deviceStates[id].in2 = null;
      deviceStates[id].in3 = null;
    });
    renderTabs();
    renderPanels();
  });
  client.on("message", (topic, message) => {
    const msg = message.toString();
    const parts = topic.split("/");
    if (parts.length !== 2) return;
    const devId = parts[0];
    const channel = parts[1];
    if (!deviceStates[devId]) return;
    if (channel === "status") deviceStates[devId].online = (msg === "ONLINE");
    else if (channel === "input1") deviceStates[devId].in1 = msg;
    else if (channel === "input2") deviceStates[devId].in2 = msg;
    else if (channel === "input3") deviceStates[devId].in3 = msg;
    renderTabs();
    if (devId === activeDevice) renderPanels();
  });
}
function subscribeDevice(id) {
  if (!client || !client.connected) return;
  ["status", "input1", "input2", "input3"].forEach(ch => client.subscribe(`${id}/${ch}`));
}
function send(deviceId, relay) {
  if (!client) return;
  client.publish(`${deviceId}/${relay}`, "ON");
}

/* ================= UI RENDER ================= */
function renderTabs() {
  const tabs = document.getElementById("tabs");
  const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--light').trim() || "#00d400";
  tabs.innerHTML = devices.map(id => {
    const online = deviceStates[id]?.online;
    return `<div class="tab ${id === activeDevice ? 'active' : ''}" onclick="selectDevice('${id}')">
      ${MOTOR_SVG(themeColor, 16)}
      <span class="dot ${online ? 'online' : ''}"></span>${id}
    </div>`;
  }).join("");
}
function selectDevice(id) {
  activeDevice = id;
  renderTabs();
  renderPanels();
}
function renderPanels() {
  const panel = document.getElementById("panels");
  const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--light').trim() || "#00d400";

  if (!activeDevice || devices.length === 0) {
    panel.innerHTML = `
      <div class="panel empty-state">
        ${MOTOR_SVG(themeColor, 80)}
        <p>এখনো কোনো ডিভাইস যোগ করা হয়নি</p>
        <p style="font-size:13px;color:#666">Settings ⚙️ থেকে একটি Device ID যোগ করুন</p>
        <button class="add-btn" onclick="openSettings()">+ Add Device</button>
      </div>
    `;
    return;
  }

  const s = deviceStates[activeDevice];
  const online = s.online;

  let in1Text = "সুরক্ষা ব্যাবস্থা : WAITING...", in1Cls = "wait";
  let in2Text = "মটর স্টেট : WAITING...", in2Cls = "wait";
  let in3Text = "পানি স্টেট : WAITING...", in3Cls = "wait";

  if (!online) {
    in1Text = in2Text = in3Text = "কারেন্ট নেই";
    in1Cls = in2Cls = in3Cls = "wait";
  } else {
    if (s.in1 === "HIGH") { in1Text = "মোটর চালু করার জন্য প্রস্তুত না"; in1Cls = "high"; }
    else if (s.in1 === "LOW") { in1Text = "মোটর চালু করার জন্য প্রস্তুত"; in1Cls = "low"; }

    if (s.in2 === "HIGH") { in2Text = "মোটর চালু না"; in2Cls = "high"; }
    else if (s.in2 === "LOW") { in2Text = "মোটর চালু"; in2Cls = "low"; }

    if (s.in3 === "HIGH") { in3Text = "পানি উঠতেছে না"; in3Cls = "high"; }
    else if (s.in3 === "LOW") { in3Text = "পানি উঠতেছে"; in3Cls = "low"; }
  }

  panel.innerHTML = `
    <div class="panel">
      <h3>${MOTOR_SVG(themeColor, 24)} Device: ${activeDevice}</h3>
      <div class="esp-line">
        ESP Status :
        <span class="status" style="background:${online ? 'lime' : 'red'}"></span>
      </div>

      <button class="btn green"
        ontouchstart="send('${activeDevice}','relay1')"
        onmousedown="send('${activeDevice}','relay1')">
        START
      </button>

      <button class="btn redbtn"
        ontouchstart="send('${activeDevice}','relay2')"
        onmousedown="send('${activeDevice}','relay2')">
        STOP
      </button>

      <div class="indicator ${in1Cls}">${in1Text}</div>
      <div class="indicator ${in2Cls}">${in2Text}</div>
      <div class="indicator ${in3Cls}">${in3Text}</div>
    </div>
  `;
}

/* ================= THEME UI ================= */
function renderThemeGrid() {
  const grid = document.getElementById("themeGrid");
  if (!grid) return;
  const active = localStorage.getItem(THEME_KEY) || "green";
  grid.innerHTML = Object.entries(THEMES).map(([key, t]) => `
    <div class="theme-swatch ${key === active ? 'active' : ''}"
         style="background:linear-gradient(135deg, ${t.primary}, ${t.light})"
         onclick="changeTheme('${key}')"
         title="${t.name}">
      <span>${t.name}</span>
    </div>
  `).join("");
}
function changeTheme(key) { applyTheme(key); }

/* ================= SETTINGS ================= */
function openSettings() {
  renderDeviceList();
  renderThemeGrid();
  document.getElementById("settingsModal").classList.add("show");
}
function closeSettings() {
  document.getElementById("settingsModal").classList.remove("show");
}

/* ================= INIT (No Login) ================= */
window.addEventListener("load", () => {
  const savedTheme = localStorage.getItem(THEME_KEY) || "green";
  const savedBg = localStorage.getItem(BG_KEY);
  applyTheme(savedTheme);
  applyBg(savedBg);
  initDashboard();
});
</script>
</body>
</html>
